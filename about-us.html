<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .about-hero {
      background: linear-gradient(135deg, var(--brand-primary, #0f7b6c) 0%, #1e4fd8 100%);
      border-radius: 20px;
      padding: 60px 40px;
      color: #fff;
      text-align: center;
      margin-bottom: 32px;
    }
    .about-hero-tag {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 100px;
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .about-hero h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin: 0 0 16px; }
    .about-hero p { font-size: 1.1rem; opacity: 0.88; max-width: 640px; margin: 0 auto 32px; }
    .about-hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .about-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
      margin-top: 40px;
    }
    .about-stat-tile {
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
    }
    .about-stat-tile .stat-val { font-size: 2rem; font-weight: 800; }
    .about-stat-tile .stat-lbl { font-size: 0.78rem; opacity: 0.82; margin-top: 4px; }
    .mv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 640px) { .mv-grid { grid-template-columns: 1fr; } }
    .mv-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 18px;
      padding: 32px 24px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    }
    .mv-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--brand-soft, #e8f5f3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--brand-primary, #0f7b6c);
      flex-shrink: 0;
    }
    .mv-card h3 { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; }
    .mv-card p { color: var(--text-muted, #64748b); line-height: 1.6; margin: 0; font-size: 0.95rem; }
    .values-section { margin-bottom: 32px; }
    .values-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .value-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .value-card:hover { box-shadow: 0 8px 24px rgba(15,23,42,0.1); transform: translateY(-2px); }
    .value-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--brand-soft, #e8f5f3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: var(--brand-primary, #0f7b6c); flex-shrink: 0;
    }
    .value-card h4 { font-size: 1rem; font-weight: 700; margin: 0 0 6px; }
    .value-card p { color: var(--text-muted, #64748b); font-size: 0.9rem; line-height: 1.5; margin: 0; }
    .story-section {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 18px;
      padding: 36px 32px;
      max-width: 780px;
      margin: 0 auto 32px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    }
    .story-section h2 { font-size: 1.5rem; font-weight: 800; margin: 0 0 20px; }
    .story-section p { color: var(--text-muted, #64748b); line-height: 1.8; margin-bottom: 16px; font-size: 0.98rem; }
    .about-cta-section {
      background: var(--surface-1, #f1f5f9);
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      margin-bottom: 32px;
    }
    .about-cta-section h2 { font-size: 1.6rem; font-weight: 800; margin: 0 0 12px; }
    .about-cta-section p { color: var(--text-muted, #64748b); margin: 0 auto 28px; max-width: 540px; }
    .about-cta-section .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-primary, #0f7b6c);
      margin-bottom: 10px;
    }
    .section-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 8px; }
    .section-desc { color: var(--text-muted, #64748b); margin: 0 0 24px; }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>

    <!-- Hero -->
    <section class="about-hero" id="aboutHeroSection">
      <div class="about-hero-tag" id="aboutHeroTag">Our Story</div>
      <h1 id="aboutHeroHeadline">About College OS</h1>
      <p id="aboutHeroDesc">College OS is a student-first learning platform built to help engineering and degree students ace exams, build skills, and launch careers — all in one place.</p>
      <div class="about-hero-cta">
        <a class="btn" id="aboutHeroCta" href="login.html?mode=signup" style="background:#fff;color:#0f7b6c;font-weight:700;">Get Started Free</a>
        <a class="btn secondary" href="help-center.html" style="border-color:rgba(255,255,255,0.4);color:#fff;">Help Center</a>
      </div>
      <div class="about-stats-grid" id="aboutStatsGrid">
        <div class="about-stat-tile"><div class="stat-val">10K+</div><div class="stat-lbl">Students Enrolled</div></div>
        <div class="about-stat-tile"><div class="stat-val">500+</div><div class="stat-lbl">Study Resources</div></div>
        <div class="about-stat-tile"><div class="stat-val">98%</div><div class="stat-lbl">Student Satisfaction</div></div>
        <div class="about-stat-tile"><div class="stat-val">24/7</div><div class="stat-lbl">AI-Powered Support</div></div>
      </div>
    </section>

    <!-- Mission & Vision -->
    <div id="missionVisionSection" class="mv-grid">
      <div class="mv-card">
        <div class="mv-icon" id="missionIcon"><i class="fa-solid fa-rocket"></i></div>
        <div>
          <h3 id="missionTitle">Our Mission</h3>
          <p id="missionDesc">We exist to democratise quality education for every college student — regardless of college name, city, or budget.</p>
        </div>
      </div>
      <div class="mv-card">
        <div class="mv-icon" id="visionIcon"><i class="fa-solid fa-eye"></i></div>
        <div>
          <h3 id="visionTitle">Our Vision</h3>
          <p id="visionDesc">A future where every student in India walks into an exam room fully prepared, fully confident, and focused on their potential.</p>
        </div>
      </div>
    </div>

    <!-- Values -->
    <section class="values-section" id="valuesSection">
      <div class="section-label">Our Values</div>
      <div class="section-title" id="valuesTitle">What We Stand For</div>
      <div class="values-grid" id="valuesGrid">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Story -->
    <section class="story-section" id="storySection">
      <h2 id="storyTitle">The College OS Story</h2>
      <div id="storyParagraphs"></div>
    </section>

    <!-- CTA -->
    <section class="about-cta-section" id="aboutCtaSection">
      <h2 id="aboutCtaTitle">Join Thousands of Students Already Learning Smarter</h2>
      <p id="aboutCtaDesc">Start free today. Upgrade to Premium when you're ready for the full experience.</p>
      <div class="actions">
        <a class="btn primary" id="aboutCtaPrimary" href="login.html?mode=signup">Start Learning Free</a>
        <a class="btn secondary" id="aboutCtaSecondary" href="home.html">Explore Features</a>
      </div>
    </section>

  </template>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/company-support.js"></script>
</body>
</html>
