<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .contact-hero {
      text-align: center;
      padding: 32px 24px 24px;
    }
    .contact-hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; margin: 0 0 12px; }
    .contact-hero p { color: var(--text-muted, #64748b); max-width: 580px; margin: 0 auto; font-size: 1.05rem; }
    .contact-channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .contact-channel-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      display: block;
    }
    .contact-channel-card:hover {
      box-shadow: 0 8px 28px rgba(15,23,42,0.1);
      transform: translateY(-3px);
      border-color: var(--brand-primary, #0f7b6c);
    }
    .channel-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--brand-soft, #e8f5f3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      color: var(--brand-primary, #0f7b6c);
      margin: 0 auto 14px;
    }
    .contact-channel-card .channel-label { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .contact-channel-card .channel-value { font-size: 0.92rem; color: var(--brand-primary, #0f7b6c); font-weight: 600; margin-bottom: 8px; }
    .contact-channel-card .channel-desc { font-size: 0.82rem; color: var(--text-muted, #64748b); }
    .contact-main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 768px) { .contact-main-grid { grid-template-columns: 1fr; } }
    .contact-form-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    }
    .contact-form-card h3 { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px; }
    .contact-form-card p.muted { margin: 0 0 20px; font-size: 0.9rem; }
    .contact-form-card .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .contact-form-card .form-grid { grid-template-columns: 1fr; } }
    .contact-form-card label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; }
    .contact-form-card input,
    .contact-form-card select,
    .contact-form-card textarea { width: 100%; box-sizing: border-box; }
    .contact-info-col { display: flex; flex-direction: column; gap: 16px; }
    .contact-info-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    }
    .contact-info-card h4 { font-size: 1rem; font-weight: 700; margin: 0 0 14px; }
    .hours-list { list-style: none; padding: 0; margin: 0; }
    .hours-list li { font-size: 0.9rem; color: var(--text-muted, #64748b); padding: 5px 0; border-bottom: 1px solid var(--border-color, #dbe4ef); }
    .hours-list li:last-child { border-bottom: 0; }
    .sla-note { font-size: 0.82rem; color: var(--brand-primary, #0f7b6c); font-weight: 600; margin-top: 10px; }
    .social-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .social-link-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-radius: 100px;
      background: var(--surface-1, #f1f5f9);
      border: 1px solid var(--border-color, #dbe4ef);
      text-decoration: none; color: inherit;
      font-size: 0.85rem; font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
    }
    .social-link-pill:hover { background: var(--brand-soft, #e8f5f3); border-color: var(--brand-primary, #0f7b6c); }
    .faq-preview-list { display: flex; flex-direction: column; gap: 10px; }
    .faq-preview-item {
      background: var(--surface-1, #f8fafc);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 12px;
      overflow: hidden;
    }
    .faq-preview-q {
      padding: 14px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .faq-preview-q:hover { background: var(--surface-0, #fff); }
    .faq-preview-a { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.3s, padding 0.3s; font-size: 0.88rem; color: var(--text-muted, #64748b); line-height: 1.6; }
    .faq-preview-item.open .faq-preview-a { max-height: 200px; padding: 0 16px 14px; }
    .faq-preview-item.open .faq-chevron { transform: rotate(180deg); }
    .faq-chevron { transition: transform 0.3s; }
    .form-success-banner {
      display: none;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 16px 20px;
      color: #166534;
      font-weight: 600;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>

    <!-- Hero -->
    <section class="contact-hero">
      <h1 id="contactHeroTitle">Get in Touch</h1>
      <p id="contactHeroDesc">Have a question, feedback, or need support? We're here to help. Pick the right channel and we'll get back to you fast.</p>
    </section>

    <!-- Channel Cards -->
    <div class="contact-channels-grid" id="contactChannelsGrid">
      <!-- Populated by JS -->
    </div>

    <!-- Contact Form + Info -->
    <div class="contact-main-grid">
      <!-- Contact Form -->
      <div id="contactFormSection" class="contact-form-card">
        <h3 id="contactFormTitle">Send Us a Message</h3>
        <p class="muted" id="contactFormDesc">Fill out the form and we'll get back to you within 24 hours.</p>
        <form id="contactForm" novalidate>
          <div class="form-grid" style="margin-bottom:14px;">
            <div>
              <label for="contactName">Your Name</label>
              <input type="text" id="contactName" placeholder="Full name" required />
            </div>
            <div>
              <label for="contactEmail">Email Address</label>
              <input type="email" id="contactEmail" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-grid" style="margin-bottom:14px;">
            <div>
              <label for="contactCategory">Category</label>
              <select id="contactCategory">
                <option>General Query</option>
                <option>Technical Bug</option>
                <option>Billing &amp; Payment</option>
                <option>Account Issue</option>
                <option>Feature Request</option>
                <option>Study Help</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label for="contactPriority">Priority</label>
              <select id="contactPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:14px;">
            <label for="contactSubject">Subject</label>
            <input type="text" id="contactSubject" placeholder="Brief description of your issue" required />
          </div>
          <div style="margin-bottom:18px;">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" rows="5" placeholder="Describe your issue or question in detail..." required></textarea>
          </div>
          <div class="actions">
            <button class="btn primary" type="submit" id="contactSubmitBtn">
              <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
            <a class="btn secondary" href="my-tickets.html">View My Tickets</a>
          </div>
          <div class="form-success-banner" id="contactFormSuccess"></div>
          <p class="muted" id="contactFormError" style="color:#dc2626;margin-top:8px;display:none;"></p>
        </form>
      </div>

      <!-- Info Column -->
      <div class="contact-info-col">
        <!-- Support Hours -->
        <div class="contact-info-card" id="contactHoursCard">
          <h4 id="contactHoursTitle">Support Hours</h4>
          <ul class="hours-list" id="contactHoursList"></ul>
          <p class="sla-note" id="contactSlaNvote"></p>
        </div>

        <!-- Social Links -->
        <div class="contact-info-card" id="contactSocialCard">
          <h4 id="contactSocialTitle">Find Us Online</h4>
          <div class="social-links" id="contactSocialLinks"></div>
        </div>

        <!-- FAQ Preview -->
        <div class="contact-info-card" id="contactFaqCard">
          <h4>Quick Answers</h4>
          <div class="faq-preview-list" id="contactFaqList"></div>
          <div style="margin-top:14px;">
            <a class="btn secondary" href="help-center.html" style="width:100%;text-align:center;">
              <i class="fa-solid fa-circle-question"></i> Browse Full Help Center
            </a>
          </div>
        </div>
      </div>
    </div>

  </template>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/company-support.js"></script>
</body>
</html>
