<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Hub - College OS</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .live-hub-shell { padding: 1rem; display:flex; gap:1rem; }
    .live-hub-stage { flex: 2; background:#fff; border:1px solid #e6edf3; padding:1rem; min-height:400px }
    .live-hub-side { width:360px; display:flex; flex-direction:column; gap:1rem }
    .live-hub-chat { background:#fff; border:1px solid #e6edf3; padding:0.5rem; display:flex; flex-direction:column; height:420px }
    .live-hub-chat-list { overflow:auto; flex:1; padding:0.5rem }
    .live-hub-chat-input { border-top:1px solid #eee; padding:0.5rem }
    .live-hub-activity-feed { max-height:120px; overflow:auto; background:#fbfbfe; padding:0.5rem }
    .live-hub-presence { font-weight:600 }
    .live-hub-controls { display:flex; gap:.5rem; align-items:center }
    .live-hub-toast { position:fixed; right:1rem; bottom:1rem; background:#111; color:#fff; padding:.6rem 1rem; border-radius:6px; opacity:.95 }
  </style>
</head>
<body>
  <div class="live-hub-shell">
    <div class="live-hub-stage">
      <div class="live-hub-head">
        <h2 class="live-hub-title">Live Session</h2>
        <div class="live-hub-status-row">
          <span class="live-hub-status-badge">Connecting…</span>
          <span class="live-hub-presence-count">0</span> participants
        </div>
      </div>
      <div class="live-hub-stage-content">
        <div class="live-hub-waiting-room">Waiting room / video area</div>
      </div>
      <div class="live-hub-controls">
        <button class="btn primary live-hub-raise-hand">Raise Hand</button>
        <div class="reactions">
          <button class="live-hub-reaction-btn" data-reaction="👍">👍</button>
          <button class="live-hub-reaction-btn" data-reaction="👏">👏</button>
          <button class="live-hub-reaction-btn" data-reaction="🎉">🎉</button>
        </div>
      </div>
    </div>

    <aside class="live-hub-side">
      <section class="live-hub-chat">
        <div class="live-hub-chat-head"><strong>Chat</strong></div>
        <div class="live-hub-chat-list"></div>
        <div class="live-hub-chat-input"><input class="live-hub-chat-input-field" type="text" placeholder="Say something…" /></div>
      </section>

      <section class="live-hub-activity">
        <div class="live-hub-activity-head"><strong>Activity</strong></div>
        <div class="live-hub-activity-feed"></div>
      </section>

      <section class="live-hub-meta">
        <div class="live-hub-typing"></div>
      </section>
    </aside>
  </div>

  <script src="https://cdn.socket.io/4.9.0/socket.io.min.js"></script>
  <script src="/assets/js/live-session/socketClient.js"></script>
  <script src="/assets/js/live-session/presence.js"></script>
  <script src="/assets/js/live-session/chat.js"></script>
  <script src="/assets/js/live-session/init.js"></script>
</body>
</html>
