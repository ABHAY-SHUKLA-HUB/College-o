<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Materials - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .materials-hero {
      background: linear-gradient(135deg, #0f766e 0%, #0ea5e9 100%);
      color: #fff;
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(15, 118, 110, 0.2);
    }

    .materials-hero h1 {
      margin: 0 0 8px 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.1;
    }

    .materials-hero p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.95;
      max-width: 60ch;
    }

    .materials-toolbar {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .materials-filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .materials-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .materials-btn {
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      padding: 8px 16px;
      background: #fff;
      color: #334155;
      cursor: pointer;
      font-weight: 500;
      transition: all 140ms ease;
      font-size: 0.9rem;
    }

    .materials-btn:hover {
      border-color: #0ea5e9;
      color: #0ea5e9;
      background: #f0f9ff;
    }

    .materials-btn.active {
      background: #0ea5e9;
      color: #fff;
      border-color: #0ea5e9;
    }

    .materials-select {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font: inherit;
      font-size: 0.95rem;
      background: #fff;
    }

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .material-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      display: grid;
      gap: 12px;
      transition: all 180ms ease;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .material-card:hover {
      transform: translateY(-4px);
      border-color: #0ea5e9;
      box-shadow: 0 12px 28px rgba(15, 118, 110, 0.15);
    }

    .material-card.book {
      border-left: 4px solid #8b5cf6;
    }

    .material-card.ppt {
      border-left: 4px solid #f59e0b;
    }

    .material-icon {
      font-size: 2.4rem;
      margin-bottom: 4px;
    }

    .material-type-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      width: fit-content;
    }

    .material-type-badge.book {
      background: #faf5ff;
      color: #7c3aed;
      border: 1px solid #e9d5ff;
    }

    .material-type-badge.ppt {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .material-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.3;
    }

    .material-meta {
      display: grid;
      gap: 6px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .material-meta-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .material-meta-item i {
      opacity: 0.6;
      width: 16px;
    }

    .material-desc {
      margin: 0;
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .material-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .material-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .material-tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: #f1f5f9;
      color: #475569;
    }

    .material-access {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #dbeafe;
      color: #0369a1;
    }

    .material-access.premium {
      background: #fef08a;
      color: #a16207;
    }

    .materials-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .materials-empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .materials-loader {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    @media (max-width: 768px) {
      .materials-grid {
        grid-template-columns: 1fr;
      }
      
      .materials-hero {
        padding: 24px;
      }

      .materials-filter-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="materials-hero">
      <h1><i class="fa-solid fa-book-open"></i> Learning Materials</h1>
      <p>Explore curated books, presentations, and reference materials to enhance your learning experience.</p>
    </section>

    <section class="card">
      <div class="materials-toolbar">
        <div>
          <p style="margin: 0 0 10px 0; font-weight: 600; font-size: 0.9rem; color: #475569;">Material Type</p>
          <div class="materials-btn-group">
            <button class="materials-btn active" data-type-filter="all"><i class="fa-solid fa-book"></i> All Materials</button>
            <button class="materials-btn" data-type-filter="book"><i class="fa-solid fa-book"></i> Books</button>
            <button class="materials-btn" data-type-filter="ppt"><i class="fa-solid fa-presentation"></i> Presentations</button>
          </div>
        </div>

        <div class="materials-filter-row">
          <div>
            <label style="font-weight: 600; font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px;">Subject</label>
            <select id="materialsSubjectFilter" class="materials-select" style="width:100%;"><option value="">All Subjects</option></select>
          </div>
          <div>
            <label style="font-weight: 600; font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px;">Semester</label>
            <select id="materialsSemesterFilter" class="materials-select" style="width:100%;"><option value="">All Semesters</option></select>
          </div>
          <div>
            <label style="font-weight: 600; font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px;">Branch</label>
            <select id="materialsBranchFilter" class="materials-select" style="width:100%;"><option value="">All Branches</option></select>
          </div>
          <div>
            <label style="font-weight: 600; font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px;">Search</label>
            <input id="materialsSearch" type="text" class="materials-select" style="width:100%;" placeholder="Search by title..." />
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="materials-grid" id="materialsGrid">
        <div class="materials-loader">Loading materials...</div>
      </div>
    </section>
  </template>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app-base.js"></script>
  <script>
    const materialsFilters = {
      type: 'all',
      subject: '',
      semester: '',
      branch: '',
      search: ''
    };

    async function loadMaterialsOptions() {
      try {
        const [categoriesResp, semestersResp, branchesResp] = await Promise.all([
          fetch('/api/student/library/materials/categories', { credentials: 'include' }).then(r => r.json()),
          fetch('/api/student/library/materials/semesters', { credentials: 'include' }).then(r => r.json()),
          fetch('/api/student/library/materials/branches', { credentials: 'include' }).then(r => r.json())
        ]);

        const subjectSelect = document.getElementById('materialsSubjectFilter');
        if (categoriesResp.categories) {
          categoriesResp.categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.id;
            option.textContent = cat.name;
            subjectSelect.appendChild(option);
          });
        }

        const semesterSelect = document.getElementById('materialsSemesterFilter');
        if (semestersResp.semesters) {
          semestersResp.semesters.forEach(sem => {
            const option = document.createElement('option');
            option.value = sem.id;
            option.textContent = sem.label;
            semesterSelect.appendChild(option);
          });
        }

        const branchSelect = document.getElementById('materialsBranchFilter');
        if (branchesResp.branches) {
          branchesResp.branches.forEach(br => {
            const option = document.createElement('option');
            option.value = br.id;
            option.textContent = br.name;
            branchSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading options:', error);
      }
    }

    async function loadMaterials() {
      const grid = document.getElementById('materialsGrid');
      grid.innerHTML = '<div class="materials-loader">Loading materials...</div>';

      try {
        const params = new URLSearchParams();
        if (materialsFilters.type && materialsFilters.type !== 'all') {
          params.set('type', materialsFilters.type);
        }
        if (materialsFilters.subject) params.set('categoryId', materialsFilters.subject);
        if (materialsFilters.semester) params.set('semesterId', materialsFilters.semester);
        if (materialsFilters.branch) params.set('branchId', materialsFilters.branch);
        if (materialsFilters.search) params.set('search', materialsFilters.search);

        const suffix = params.toString() ? `?${params.toString()}` : '';
        const response = await fetch(`/api/student/library/materials${suffix}`, { credentials: 'include' });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Failed to load materials');

        if (data.materials && data.materials.length > 0) {
          grid.innerHTML = data.materials.map(material => {
            const isBook = material.material_type === 'book';
            const isPpt = material.material_type === 'ppt';
            const icon = isBook ? '📚' : isPpt ? '🎯' : '📄';
            const typeName = isBook ? 'Book' : isPpt ? 'Presentation' : 'Material';
            const typeClass = isBook ? 'book' : isPpt ? 'ppt' : '';
            
            return `
              <div class="material-card ${typeClass}">
                <div style="font-size:2rem;">${icon}</div>
                <span class="material-type-badge ${typeClass}">${typeName}</span>
                <h3 class="material-title">${material.title}</h3>
                <div class="material-meta">
                  ${material.category_name ? `<div class="material-meta-item"><i class="fa-solid fa-tag"></i><span>${material.category_name}</span></div>` : ''}
                  ${material.branch_name ? `<div class="material-meta-item"><i class="fa-solid fa-graduation-cap"></i><span>${material.branch_name}</span></div>` : ''}
                  ${material.semester_label ? `<div class="material-meta-item"><i class="fa-solid fa-calendar"></i><span>${material.semester_label}</span></div>` : ''}
                </div>
                ${material.description ? `<p class="material-desc">${material.description}</p>` : ''}
                <div class="material-footer">
                  <div class="material-tags">
                    <span class="material-tag"><i class="fa-solid fa-check-circle"></i> Verified</span>
                    ${material.is_premium ? '<span class="material-tag premium"><i class="fa-solid fa-crown"></i> Premium</span>' : ''}
                  </div>
                  <a href="${material.file_url}" target="_blank" class="btn primary sm"><i class="fa-solid fa-download"></i> View</a>
                </div>
              </div>
            `;
          }).join('');
        } else {
          grid.innerHTML = `
            <div class="materials-empty">
              <div class="materials-empty-icon"><i class="fa-solid fa-inbox"></i></div>
              <h4 style="margin: 0 0 8px 0; color: #64748b;">No materials found</h4>
              <p style="margin: 0; font-size: 0.9rem;">Try adjusting your filters or check back later.</p>
            </div>
          `;
        }
      } catch (error) {
        grid.innerHTML = `<div class="materials-empty" style="color:#c6342d;"><i class="fa-solid fa-exclamation-triangle"></i> ${error.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadMaterialsOptions();
      
      document.querySelectorAll('[data-type-filter]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('[data-type-filter]').forEach(b => b.classList.remove('active'));
          e.target.closest('[data-type-filter]').classList.add('active');
          materialsFilters.type = e.target.closest('[data-type-filter]').dataset.typeFilter;
          loadMaterials();
        });
      });

      document.getElementById('materialsSubjectFilter').addEventListener('change', (e) => {
        materialsFilters.subject = e.target.value;
        loadMaterials();
      });

      document.getElementById('materialsSemesterFilter').addEventListener('change', (e) => {
        materialsFilters.semester = e.target.value;
        loadMaterials();
      });

      document.getElementById('materialsBranchFilter').addEventListener('change', (e) => {
        materialsFilters.branch = e.target.value;
        loadMaterials();
      });

      document.getElementById('materialsSearch').addEventListener('input', (e) => {
        materialsFilters.search = e.target.value;
        loadMaterials();
      });

      await loadMaterials();
    });
  </script>
</body>
</html>
