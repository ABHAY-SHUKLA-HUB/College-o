<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Support Tickets - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .tickets-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; margin-bottom: 24px;
    }
    .tickets-header h1 { font-size: 1.6rem; font-weight: 800; margin: 0; }
    .ticket-card {
      background: var(--surface-0, #fff);
      border: 1px solid var(--border-color, #dbe4ef);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.05);
      transition: box-shadow 0.2s;
    }
    .ticket-card:hover { box-shadow: 0 6px 20px rgba(15,23,42,0.09); }
    .ticket-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .ticket-subject { font-weight: 700; font-size: 1rem; }
    .ticket-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ticket-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 100px;
      font-size: 0.75rem; font-weight: 700; text-transform: capitalize;
    }
    .badge-open { background: #dbeafe; color: #1d4ed8; }
    .badge-in_progress { background: #fef9c3; color: #854d0e; }
    .badge-resolved { background: #dcfce7; color: #166534; }
    .badge-closed { background: #f1f5f9; color: #475569; }
    .badge-high { background: #fee2e2; color: #b91c1c; }
    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-low { background: #f0fdf4; color: #166534; }
    .ticket-message {
      font-size: 0.9rem; color: var(--text-muted, #64748b);
      line-height: 1.6; margin-bottom: 10px;
    }
    .ticket-reply {
      background: var(--surface-1, #f8fafc);
      border-left: 3px solid var(--brand-primary, #0f7b6c);
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      margin-top: 12px;
    }
    .ticket-reply-label {
      font-size: 0.78rem; font-weight: 700; color: var(--brand-primary, #0f7b6c);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .ticket-reply-text { font-size: 0.9rem; line-height: 1.6; }
    .ticket-date { font-size: 0.8rem; color: var(--text-muted, #64748b); }
    .empty-tickets {
      text-align: center; padding: 60px 24px;
      color: var(--text-muted, #64748b);
    }
    .empty-tickets i { font-size: 3rem; opacity: 0.3; margin-bottom: 16px; display: block; }
    .empty-tickets p { margin: 0 0 20px; }
    .ticket-status-track {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    }
    .track-step {
      flex: 1; min-width: 80px;
      background: var(--surface-1, #f1f5f9);
      border-radius: 8px; padding: 6px 10px;
      text-align: center; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted, #64748b); position: relative;
    }
    .track-step.done {
      background: var(--brand-soft, #e8f5f3);
      color: var(--brand-primary, #0f7b6c);
    }
    .track-step.active {
      background: var(--brand-primary, #0f7b6c);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>

    <div class="tickets-header">
      <h1><i class="fa-solid fa-ticket" style="color:#0f7b6c;margin-right:10px;"></i>My Support Tickets</h1>
      <a class="btn primary" href="contact-us.html">
        <i class="fa-solid fa-plus"></i> New Ticket
      </a>
    </div>

    <!-- Tickets List -->
    <div id="ticketsList">
      <p class="muted">Loading your tickets...</p>
    </div>

  </template>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/company-support.js"></script>
</body>
</html>
