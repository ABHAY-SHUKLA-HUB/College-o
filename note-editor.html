<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College OS - Note Editor</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/quill/quill.snow.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .editor-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .editor-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e9ecef;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #495057;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #0f7b6c;
      box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.1);
    }

    .editor-wrapper {
      background: white;
      border: 1px solid #ced4da;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    #editor {
      height: 400px;
    }

    .editor-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .editor-actions button,
    .editor-actions a {
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
    }

    .btn-save {
      background: #0f7b6c;
      color: white;
    }

    .btn-save:hover {
      background: #0d6a5d;
    }

    .btn-cancel {
      background: #6c757d;
      color: white;
    }

    .btn-cancel:hover {
      background: #5a6268;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background: #c82333;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .editor-header h1 {
      margin: 0;
      color: #212529;
    }

    .editor-status {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .status-saving {
      background: #fff3cd;
      color: #856404;
    }

    .status-saved {
      background: #d4edda;
      color: #155724;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
    }

    .ql-container {
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .editor-card {
        padding: 1.5rem;
      }

      #editor {
        height: 300px;
      }

      .editor-actions {
        flex-direction: column;
      }

      .editor-actions button,
      .editor-actions a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <div class="editor-container">
      <div class="editor-header">
        <h1 data-page-title>
          <i class="fa-solid fa-pen-to-square"></i>
          <span id="pageTitle">Create Note</span>
        </h1>
        <div id="statusIndicator" class="editor-status" style="display: none;"></div>
      </div>

      <div class="editor-card">
        <form id="noteForm">
          <div class="form-group">
            <label for="noteTitle">
              <i class="fa-solid fa-heading"></i> Note Title *
            </label>
            <input 
              type="text" 
              id="noteTitle" 
              placeholder="e.g., Introduction to Machine Learning" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="noteSubject">
              <i class="fa-solid fa-book"></i> Subject *
            </label>
            <select id="noteSubject" required>
              <option value="">-- Select Subject --</option>
              <option value="AI">Artificial Intelligence</option>
              <option value="Cloud">Cloud Computing</option>
              <option value="Programming">Programming</option>
              <option value="Data Science">Data Science</option>
              <option value="Web Development">Web Development</option>
              <option value="Databases">Databases</option>
              <option value="Networking">Networking</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Personal">Personal Notes</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>
              <i class="fa-solid fa-file-lines"></i> Note Content *
            </label>
            <div class="editor-wrapper">
              <div id="editor"></div>
            </div>
          </div>

          <div class="editor-actions">
            <a href="my-notes.html" class="btn-cancel">
              <i class="fa-solid fa-times"></i> Cancel
            </a>
            <button type="button" id="deleteBtn" class="btn-delete" style="display: none;">
              <i class="fa-solid fa-trash"></i> Delete Note
            </button>
            <button type="submit" class="btn-save">
              <i class="fa-solid fa-save"></i> Save Note
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/vendor/quill/quill.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('noteForm');
      const titleInput = document.getElementById('noteTitle');
      const subjectSelect = document.getElementById('noteSubject');
      const deleteBtn = document.getElementById('deleteBtn');
      const statusIndicator = document.getElementById('statusIndicator');
      const pageTitle = document.getElementById('pageTitle');

      // Get note ID from URL if editing
      const urlParams = new URLSearchParams(window.location.search);
      const noteId = urlParams.get('id');
      const isEditing = !!noteId;

      // Initialize Quill editor
      const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Start writing your notes here...',
        modules: {
          toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'indent': '-1'}, { 'indent': '+1' }],
            ['blockquote', 'code-block'],
            ['link', 'image'],
            ['clean']
          ]
        }
      });

      function showStatus(message, type = 'saved') {
        statusIndicator.textContent = message;
        statusIndicator.className = `editor-status status-${type}`;
        statusIndicator.style.display = 'block';
        
        if (type === 'saved') {
          setTimeout(() => {
            statusIndicator.style.display = 'none';
          }, 3000);
        }
      }

      // Load existing note if editing
      if (isEditing) {
        pageTitle.textContent = 'Edit Note';
        deleteBtn.style.display = 'inline-flex';
        
        try {
          showStatus('Loading note...', 'saving');
          const response = await window.CollegeOSApi.getNote(noteId);
          const note = response.note;
          
          titleInput.value = note.chapter || '';
          subjectSelect.value = note.subject || '';
          quill.root.innerHTML = note.content || note.user_notes || '';
          
          statusIndicator.style.display = 'none';
        } catch (error) {
          showStatus('Failed to load note: ' + error.message, 'error');
        }
      }

      // Save note
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = titleInput.value.trim();
        const subject = subjectSelect.value;
        const content = quill.root.innerHTML;

        if (!title || !subject) {
          showStatus('Please fill in all required fields', 'error');
          return;
        }

        if (quill.getText().trim().length === 0) {
          showStatus('Note content cannot be empty', 'error');
          return;
        }

        const noteData = {
          subject: subject,
          chapter: title,
          content: content,
          userNotes: content,
          formatType: 'personal',
          difficulty: 'medium'
        };

        try {
          showStatus('Saving note...', 'saving');
          
          if (isEditing) {
            await window.CollegeOSApi.updateNote(noteId, noteData);
            showStatus('Note updated successfully!', 'saved');
          } else {
            await window.CollegeOSApi.createNote(noteData);
            showStatus('Note created successfully!', 'saved');
          }

          setTimeout(() => {
            window.location.href = 'my-notes.html';
          }, 1500);
        } catch (error) {
          showStatus('Failed to save note: ' + error.message, 'error');
        }
      });

      // Delete note
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('Are you sure you want to delete this note? This action cannot be undone.')) {
          return;
        }

        try {
          showStatus('Deleting note...', 'saving');
          await window.CollegeOSApi.deleteNote(noteId);
          showStatus('Note deleted successfully!', 'saved');
          
          setTimeout(() => {
            window.location.href = 'my-notes.html';
          }, 1500);
        } catch (error) {
          showStatus('Failed to delete note: ' + error.message, 'error');
        }
      });

      // Auto-save draft (optional enhancement)
      let autoSaveTimeout;
      quill.on('text-change', () => {
        clearTimeout(autoSaveTimeout);
        autoSaveTimeout = setTimeout(() => {
          const draft = {
            title: titleInput.value,
            subject: subjectSelect.value,
            content: quill.root.innerHTML
          };
          localStorage.setItem('noteDraft', JSON.stringify(draft));
        }, 2000);
      });

      // Load draft if creating new note
      if (!isEditing) {
        const draft = localStorage.getItem('noteDraft');
        if (draft) {
          try {
            const parsed = JSON.parse(draft);
            if (confirm('Found an unsaved draft. Would you like to restore it?')) {
              titleInput.value = parsed.title || '';
              subjectSelect.value = parsed.subject || '';
              quill.root.innerHTML = parsed.content || '';
            } else {
              localStorage.removeItem('noteDraft');
            }
          } catch (e) {
            localStorage.removeItem('noteDraft');
          }
        }
      }

      // Clear draft on successful save
      form.addEventListener('submit', () => {
        localStorage.removeItem('noteDraft');
      });
    });
  </script>
</body>
</html>
