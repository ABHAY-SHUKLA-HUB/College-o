<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College OS - Summarization Notes</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/print.css" />
  <link rel="stylesheet" href="assets/vendor/quill/quill.snow.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .ai-tools-shell {
      display: grid;
      gap: 1rem;
    }

    .ai-tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.65rem;
    }

    .ai-tool-btn {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background: #fff;
      padding: 0.8rem;
      font-weight: 700;
      color: #1f2d3d;
      text-align: left;
      cursor: pointer;
      transition: transform 130ms ease, box-shadow 130ms ease, border-color 130ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .ai-tool-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 123, 108, 0.5);
      box-shadow: 0 8px 20px rgba(15, 123, 108, 0.14);
    }

    .ai-tool-btn.active {
      background: linear-gradient(135deg, #eef9f6, #e9f4ff);
      border-color: #0f7b6c;
      color: #0f7b6c;
    }

    .ai-panels {
      display: grid;
      gap: 0.9rem;
    }

    .ai-panel {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 0.95rem;
      background: linear-gradient(180deg, #fff, #f8fbff);
      display: none;
      gap: 0.75rem;
    }

    .ai-panel.active {
      display: grid;
    }

    .ai-source-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.65rem;
      align-items: end;
    }

    .ai-source-grid input[type="file"] {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 0.48rem;
      background: #fff;
    }

    .ai-output {
      background: #0d1b2a;
      color: #d6f5ff;
      border-radius: 10px;
      padding: 0.8rem;
      white-space: pre-wrap;
      min-height: 120px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.92rem;
    }

    .flashcards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.7rem;
      margin-top: 0.5rem;
    }

    .flashcard {
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      background: #fff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
    }

    .flashcard h4 {
      margin: 0 0 0.4rem 0;
      color: #0c476e;
      font-size: 0.95rem;
    }

    .quiz-list {
      display: grid;
      gap: 0.7rem;
      margin-top: 0.4rem;
    }

    .quiz-item {
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      background: #fff;
    }

    .quiz-item .opts {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ai-inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.65rem;
      align-items: center;
    }

    @media (max-width: 820px) {
      .ai-source-grid,
      .ai-inline {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="hero">
      <h1 data-page-title>Summarization Notes Library</h1>
      <p>Live notes feed from your college with one-page summaries, detailed notes, and uploaded PDFs.</p>
    </section>

    <section class="card">
      <div class="form-grid">
        <div><label>Search Notes</label><input id="noteSearch" placeholder="Search by chapter, subject, concept" /></div>
        <div><label>Format</label><select id="noteFormatFilter"><option value="">All Formats</option><option value="detailed">Detailed</option><option value="one-page">One-Page</option><option value="personal">Personal</option></select></div>
        <div><label>Academic Category</label><select id="noteCategoryFilter"><option value="">All Categories</option></select></div>
        <div><label>Branch / Course</label><select id="noteBranchFilter" disabled><option value="">All Branches</option></select></div>
        <div><label>Semester / Year</label><select id="noteSemesterFilter"><option value="">All Semesters</option></select></div>
        <div><label>College</label><select id="noteCollegeFilter"><option value="">All Colleges</option></select></div>
        <div><label>Quick Action</label><button id="refreshNotesBtn" class="btn secondary" type="button">Refresh Feed</button></div>
      </div>
      <div class="actions"><button id="downloadNotesBtn" class="btn secondary">Download/Print</button><a class="btn warn" href="pricing.html">Upgrade</a></div>
      <p class="muted" id="notesStatus"></p>
    </section>

    <section class="card">
      <h3>Uploaded Notes Feed</h3>
      <div id="notesFeed" class="resource-list">
        <div class="empty-state">Loading notes...</div>
      </div>
    </section>

    <section class="grid cols-2">
      <article class="card">
        <h3>AI Summary Generator</h3>
        <textarea id="chapterInput" rows="6" placeholder="Paste long chapter text"></textarea>
        <div class="actions"><button id="aiSummarizeBtn" class="btn primary">Generate Summary</button></div>
        <pre id="aiSummaryOutput" class="muted">Summary appears here...</pre>
      </article>
      <article class="card">
        <h3>Personal Notes</h3>
        <div id="personalNotesEditor" style="height: 220px; background: #fff;"></div>
        <div class="actions"><button id="savePersonalNotesBtn" class="btn primary">Save Personal Notes</button></div>
      </article>
    </section>

    <section class="card ai-tools-shell">
      <h3><i class="fa-solid fa-brain"></i> AI Study Tools</h3>
      <p class="muted">Turn your notes into summaries, quizzes, flashcards, simplified explanations, and instant doubt resolution.</p>

      <div class="ai-source-grid">
        <div>
          <label>Notes Source</label>
          <textarea id="aiSourceInput" rows="6" placeholder="Paste your chapter notes here, or upload a .txt/.md file below"></textarea>
        </div>
        <div>
          <label>Upload Text</label>
          <input id="aiSourceFile" type="file" accept=".txt,.md,.text" />
        </div>
      </div>

      <div class="ai-tool-grid" id="aiToolsNav">
        <button class="ai-tool-btn active" data-ai-tool="summary"><i class="fa-solid fa-file-lines"></i> Generate Summary</button>
        <button class="ai-tool-btn" data-ai-tool="quiz"><i class="fa-solid fa-list-check"></i> Generate Quiz</button>
        <button class="ai-tool-btn" data-ai-tool="flashcards"><i class="fa-solid fa-layer-group"></i> Generate Flashcards</button>
        <button class="ai-tool-btn" data-ai-tool="explain"><i class="fa-solid fa-lightbulb"></i> Explain Concept</button>
        <button class="ai-tool-btn" data-ai-tool="doubt"><i class="fa-solid fa-comments"></i> Ask AI</button>
        <button class="ai-tool-btn" data-ai-tool="simplify"><i class="fa-solid fa-wand-magic-sparkles"></i> Simplify Notes</button>
      </div>

      <div class="ai-panels">
        <article class="ai-panel active" data-ai-panel="summary">
          <h4>AI Notes Summary</h4>
          <div class="actions"><button id="generateAiSummaryBtn" class="btn primary">Generate Summary</button></div>
          <div id="aiSummaryResult" class="ai-output">Short summary, bullet points, and key concepts will appear here.</div>
        </article>

        <article class="ai-panel" data-ai-panel="quiz">
          <h4>AI Quiz Generator</h4>
          <div class="actions"><button id="generateAiQuizBtn" class="btn primary">Generate Quiz</button></div>
          <div id="aiQuizResult" class="quiz-list"></div>
        </article>

        <article class="ai-panel" data-ai-panel="flashcards">
          <h4>AI Flashcards Generator</h4>
          <div class="actions"><button id="generateFlashcardsBtn" class="btn primary">Generate Flashcards</button></div>
          <div id="aiFlashcardsResult" class="flashcards-grid"></div>
        </article>

        <article class="ai-panel" data-ai-panel="explain">
          <h4>AI Concept Explainer</h4>
          <div class="ai-inline">
            <input id="aiExplainTopicInput" placeholder="Type a topic, e.g., Dynamic Programming" />
            <button id="explainConceptBtn" class="btn primary">Explain Concept</button>
          </div>
          <div id="aiExplainResult" class="ai-output">Simple concept explanation appears here.</div>
        </article>

        <article class="ai-panel" data-ai-panel="doubt">
          <h4>AI Doubt Solver</h4>
          <div class="ai-inline">
            <input id="aiDoubtInput" placeholder="Ask a study doubt, e.g., Why is binary search O(log n)?" />
            <button id="askAiBtn" class="btn primary">Ask AI</button>
          </div>
          <div id="aiDoubtResult" class="ai-output">Instant answer appears here.</div>
        </article>

        <article class="ai-panel" data-ai-panel="simplify">
          <h4>AI Notes Simplifier</h4>
          <div class="actions"><button id="simplifyNotesBtn" class="btn primary">Simplify Notes</button></div>
          <div id="aiSimplifyResult" class="ai-output">Complex notes rewritten in simple language appear here.</div>
        </article>
      </div>
    </section>
  </template>
  <script src="assets/vendor/quill/quill.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/notes.js"></script>
</body>
</html>
