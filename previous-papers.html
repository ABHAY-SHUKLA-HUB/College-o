<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Previous Year Papers - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    /* Protected PDF Viewer Modal */
    .pdf-viewer-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      z-index: 999999;
      flex-direction: column;
    }

    .pdf-viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #0f172a;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pdf-viewer-body {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="hero"><h1 data-page-title>Previous Year Papers</h1><p>Live papers feed uploaded by admins, with college-aware filtering and revision actions.</p></section>

    <section class="card">
      <div class="form-grid">
        <div><label>College Filter</label><select id="papersCollegeFilter"><option value="">My College</option></select></div>
        <div><label>Search Exam</label><input id="paperSearch" placeholder="Search by exam name or subject" /></div>
      </div>
      <div class="actions">
        <span style="display:inline-flex; align-items:center; gap:6px; font-size:0.85rem; color:#0f7b6c; font-weight:600; background:#eef9f6; padding:6px 12px; border-radius:8px; border:1px solid rgba(15,123,108,0.2);">
          <i class="fa-solid fa-lock"></i> Protected View Mode Active
        </span>
        <button class="btn secondary" id="refreshPapersBtn">Refresh Papers</button>
        <a class="btn warn" href="pricing.html">Upgrade</a>
      </div>
      <p class="muted" id="papersStatus"></p>
    </section>

    <section class="card">
      <h3>Uploaded Previous Papers</h3>
      <div id="papersFeed" class="resource-list"><div class="empty-state">Loading papers...</div></div>
    </section>
  </template>

  <!-- Protected PDF Viewer Modal overlay -->
  <div id="pdfViewerModal" class="pdf-viewer-modal">
    <div class="pdf-viewer-header">
      <div style="display:flex; align-items:center; gap:12px;">
        <i class="fa-solid fa-shield-halved" style="color:#0ea5e9; font-size:1.3rem;"></i>
        <div>
          <h4 id="pdfViewerTitle" style="margin:0; font-size:1rem; font-weight:600; color:#fff;">Document Viewer</h4>
          <span style="font-size:0.75rem; color:#94a3b8;"><i class="fa-solid fa-lock"></i> Protected View Mode — Application Download Disabled</span>
        </div>
      </div>
      <button id="closePdfViewerBtn" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:500; display:flex; align-items:center; gap:6px;"><i class="fa-solid fa-xmark"></i> Close Viewer</button>
    </div>
    <div class="pdf-viewer-body">
      <iframe id="pdfViewerFrame" style="width:100%; height:100%; border:none;" src="about:blank"></iframe>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/content-pages.js"></script>
</body>
</html>
