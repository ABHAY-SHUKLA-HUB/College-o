<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Center - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .membership-page {
      display: grid;
      gap: 1rem;
      padding-bottom: 3rem;
    }

    .membership-panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    .membership-hero {
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
      color: #f8fbff;
      background:
        radial-gradient(circle at 82% 10%, rgba(250, 204, 21, 0.22), transparent 34%),
        radial-gradient(circle at 10% 100%, rgba(45, 212, 191, 0.2), transparent 38%),
        linear-gradient(135deg, #0f172a 0%, #1d4ed8 44%, #0f766e 100%);
    }

    .membership-hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.95fr);
      gap: 1rem;
      align-items: stretch;
    }

    .membership-kicker {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 800;
      opacity: 0.9;
    }

    .membership-hero h1 {
      margin: 0.4rem 0 0;
      font-size: clamp(1.7rem, 2.5vw, 2.5rem);
      letter-spacing: -0.02em;
    }

    .membership-hero p {
      margin: 0.65rem 0 0;
      max-width: 68ch;
      color: rgba(248, 250, 252, 0.92);
    }

    .membership-benefits {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .membership-benefits span {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.11);
      font-size: 0.84rem;
    }

    .hero-price-card {
      display: grid;
      gap: 0.65rem;
      align-content: start;
      padding: 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .hero-price-kicker {
      margin: 0;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .hero-price-card h3 {
      margin: 0;
      font-size: 2rem;
    }

    .hero-price-card h3 span {
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0.88;
    }

    .membership-grid {
      display: grid;
      gap: 1rem;
    }

    .membership-grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .membership-card {
      padding: 1.2rem;
    }

    .membership-summary-head,
    .membership-plan-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .membership-summary-head h3,
    .membership-card h3,
    .membership-card h4,
    .membership-card p,
    .membership-card ul {
      margin-top: 0;
    }

    .membership-summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 0.9rem;
    }

    .membership-mini-stat {
      display: grid;
      gap: 0.3rem;
      padding: 0.8rem 0.9rem;
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.95);
      border: 1px solid rgba(15, 23, 42, 0.07);
    }

    .membership-mini-stat label {
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    .membership-mini-stat strong {
      font-size: 0.96rem;
      color: #0f172a;
    }

    .membership-message-box,
    .premium-lock-note {
      margin-top: 0.9rem;
      padding: 0.85rem 0.95rem;
      border-radius: 16px;
      background: rgba(239, 246, 255, 0.95);
      border: 1px solid rgba(59, 130, 246, 0.14);
      color: #1e3a8a;
    }

    .premium-lock-note {
      background: rgba(240, 253, 250, 0.9);
      border-color: rgba(13, 148, 136, 0.14);
      color: #115e59;
    }

    .membership-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #e2e8f0;
      color: #334155;
    }

    .membership-status-badge.active {
      background: #dcfce7;
      color: #166534;
    }

    .membership-status-badge.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .membership-status-badge.rejected,
    .membership-status-badge.expired {
      background: #fee2e2;
      color: #b91c1c;
    }

    .membership-status-badge.free {
      background: #e2e8f0;
      color: #334155;
    }

    .actions.actions-spread {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
      margin-top: 1rem;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
      margin-top: 0.85rem;
    }

    .plan-box {
      position: relative;
      display: grid;
      gap: 0.75rem;
      padding: 1rem;
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.98), rgba(241, 245, 249, 0.92));
    }

    .plan-box.premium {
      border-color: rgba(29, 78, 216, 0.26);
      background: linear-gradient(145deg, #edf4ff, #ecfeff);
      overflow: hidden;
    }

    .plan-tag {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      margin: 0;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: linear-gradient(120deg, #facc15, #fb7185);
      color: #082f49;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .plan-box h4 {
      margin-bottom: 0.2rem;
      font-size: 1.05rem;
    }

    .plan-price {
      margin: 0;
      font-size: 1.9rem;
      color: #0f172a;
    }

    .plan-price span {
      font-size: 0.84rem;
      color: #64748b;
      font-weight: 600;
    }

    .feature-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      color: #334155;
      font-size: 0.84rem;
    }

    .feature-list i {
      margin-top: 0.12rem;
      color: #0f766e;
    }

    .comparison-wrap,
    .history-wrap {
      overflow: auto;
      margin-top: 0.85rem;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.98);
    }

    .comparison-wrap table,
    .payment-history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .comparison-wrap th,
    .comparison-wrap td,
    .payment-history-table th,
    .payment-history-table td {
      padding: 0.82rem;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      text-align: left;
      font-size: 0.82rem;
    }

    .comparison-wrap th,
    .payment-history-table th {
      background: #f8fafc;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 1rem;
    }

    .payment-card {
      padding: 1.15rem;
    }

    .upi-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-top: 0.75rem;
    }

    .upi-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #fff;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .instructions-list {
      list-style: none;
      margin: 0.85rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .instructions-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      color: #334155;
      font-size: 0.83rem;
    }

    .instructions-list li span {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.72rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .qr-wrap {
      margin-top: 0.75rem;
      min-height: 240px;
      display: grid;
      place-items: center;
      padding: 1rem;
      border-radius: 16px;
      border: 1px dashed rgba(15, 23, 42, 0.18);
      background: #fff;
    }

    .qr-wrap img {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 12px;
    }

    .status-tracker {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 0.85rem;
    }

    .tracker-step {
      display: grid;
      gap: 0.3rem;
      padding: 0.8rem;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
    }

    .tracker-step span {
      width: 26px;
      height: 26px;
      margin: 0 auto;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .tracker-step label {
      font-size: 0.76rem;
      font-weight: 700;
      color: #334155;
    }

    .tracker-step.done span,
    .tracker-step.active span {
      background: #10b981;
      color: #fff;
    }

    .tracker-step.active {
      border-color: rgba(16, 185, 129, 0.36);
      background: rgba(220, 252, 231, 0.78);
    }

    .tracker-step.danger span {
      background: #ef4444;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
      margin-top: 0.8rem;
    }

    .form-grid > div,
    .payment-form > div {
      display: grid;
      gap: 0.35rem;
    }

    .payment-form label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 1040px) {
      .membership-hero-grid,
      .membership-grid.cols-2,
      .plan-grid,
      .payment-grid {
        grid-template-columns: 1fr;
      }

      .status-tracker {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .membership-benefits,
      .membership-summary-grid,
      .form-grid,
      .status-tracker {
        grid-template-columns: 1fr;
      }

      .actions.actions-spread {
        justify-content: stretch;
      }

      .actions.actions-spread .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="membership-page">
      <section class="membership-panel membership-hero">
        <div class="membership-hero-grid">
          <div>
            <p class="membership-kicker">Premium Membership</p>
            <h1 data-page-title id="membershipHeroTitle">Membership Center</h1>
            <p id="membershipHeroSubtitle">Unlock full access to tests, notes, roadmap, certificates, and premium resources with a transparent admin-approved membership flow.</p>
            <div class="membership-benefits" id="membershipHeroBenefits">
              <span><i class="fa-solid fa-sparkles"></i> Unlimited notes</span>
              <span><i class="fa-solid fa-sparkles"></i> Mock tests and analytics</span>
              <span><i class="fa-solid fa-sparkles"></i> AI tools access</span>
              <span><i class="fa-solid fa-sparkles"></i> Certificates and downloads</span>
            </div>
          </div>
          <aside class="hero-price-card">
            <p class="hero-price-kicker">Premium Plan</p>
            <h3 id="heroPremiumPrice">Rs.49 <span>/ month</span></h3>
            <p id="heroPremiumDescription">A real subscription experience with payment proof, approval status, and renewal visibility.</p>
            <button id="upgradePremiumBtn" class="btn warn btn-pill" type="button"><i class="fa-solid fa-crown"></i> Upgrade to Premium</button>
          </aside>
        </div>
      </section>

      <section class="membership-grid cols-2">
        <article class="membership-panel membership-card">
          <div class="membership-summary-head">
            <div>
              <h3>Current Membership</h3>
              <p class="muted" id="subscriptionStatus">Loading membership...</p>
            </div>
            <span id="membershipStatusBadge" class="membership-status-badge free">Free</span>
          </div>
          <div class="membership-summary-grid">
            <div class="membership-mini-stat"><label>Current Plan</label><strong id="currentPlan">Free</strong></div>
            <div class="membership-mini-stat"><label>Status</label><strong id="currentMembershipStatus">Free</strong></div>
            <div class="membership-mini-stat"><label>Start Date</label><strong id="membershipStartDate">-</strong></div>
            <div class="membership-mini-stat"><label>Expiry Date</label><strong id="membershipExpiryDate">-</strong></div>
          </div>
          <div class="membership-message-box" id="membershipCountdown">Free users can attempt 2 test papers.</div>
          <p class="premium-lock-note" id="premiumLockMessage">Premium features will unlock after admin approval.</p>
          <div class="actions actions-spread">
            <button id="renewPremiumBtn" class="btn secondary btn-pill" type="button"><i class="fa-solid fa-rotate"></i> Renew Membership</button>
            <button id="jumpToPaymentBtn" class="btn primary btn-pill" type="button"><i class="fa-solid fa-arrow-down"></i> Pay Now</button>
          </div>
        </article>

        <article class="membership-panel membership-card">
          <h3>Pricing Plans</h3>
          <div class="plan-grid">
            <div class="plan-box">
              <div class="membership-plan-head">
                <div>
                  <h4 id="planFreeName">Free Plan</h4>
                  <p class="muted" id="planFreeDescription">Start learning with core resources.</p>
                </div>
                <i class="fa-regular fa-circle" style="color:#64748b;"></i>
              </div>
              <p class="plan-price">Rs.<span id="planFreePrice">0</span><span id="planFreeBilling"> / forever</span></p>
              <ul class="feature-list" id="planFreeFeatures">
                <li><i class="fa-solid fa-check"></i><span>Basic dashboard access</span></li>
              </ul>
            </div>
            <div class="plan-box premium">
              <p class="plan-tag">Best Value</p>
              <div class="membership-plan-head">
                <div>
                  <h4 id="planPremiumName">Premium Plan</h4>
                  <p class="muted" id="planPremiumDescription">Full platform access for serious learners.</p>
                </div>
                <i class="fa-solid fa-crown" style="color:#1d4ed8;"></i>
              </div>
              <p class="plan-price">Rs.<span id="planPremiumPrice">49</span><span id="planPremiumBilling"> / month</span></p>
              <ul class="feature-list" id="planPremiumFeatures">
                <li><i class="fa-solid fa-circle-check"></i><span>Unlimited mock tests</span></li>
              </ul>
              <button class="btn primary btn-pill" id="upgradePremiumInlineBtn" type="button"><i class="fa-solid fa-rocket"></i> Upgrade Now</button>
            </div>
          </div>
        </article>
        <article class="membership-panel membership-card">
          <h3>Your Feedback</h3>
          <p class="muted">Help us improve College OS by sharing your experience and suggestions.</p>
          <div class="actions"><a class="btn secondary" href="feedback.html">Submit Feedback</a></div>
        </article>
      </section>

      <section class="membership-panel membership-card">
        <h3>Plan Comparison</h3>
        <div class="comparison-wrap">
          <table>
            <thead>
              <tr>
                <th>Feature</th>
                <th>Free</th>
                <th>Premium</th>
              </tr>
            </thead>
            <tbody id="planComparisonBody"></tbody>
          </table>
        </div>
      </section>

      <section class="payment-grid" id="paymentZone">
        <article class="membership-panel payment-card">
          <h3>Pay For Premium</h3>
          <p class="muted">Use UPI for quick activation. Submit your transaction after payment.</p>
          <div class="upi-row">
            <span class="upi-pill" id="upiIdText">shuklaabhayas0-1@okicici</span>
            <button id="copyUpiBtn" class="btn secondary btn-pill" type="button"><i class="fa-regular fa-copy"></i> Copy UPI ID</button>
            <button id="openUpiBtn" class="btn primary btn-pill" type="button"><i class="fa-solid fa-mobile-screen-button"></i> Open UPI App</button>
          </div>
          <p class="muted" id="upiCopyStatus">Pay via any UPI app and submit proof below.</p>
          <ul class="instructions-list" id="paymentInstructionsList">
            <li><span>1</span><div>Scan the QR code or copy the UPI ID.</div></li>
            <li><span>2</span><div>Pay the premium amount shown on this page.</div></li>
            <li><span>3</span><div>Submit your transaction ID and payment date for approval.</div></li>
          </ul>
        </article>

        <article class="membership-panel payment-card">
          <h3>Scan QR Code</h3>
          <div class="qr-wrap"><img id="upiQrImage" alt="UPI QR Code" /></div>
          <button id="copyUpiBtnSecondary" class="btn secondary btn-pill" type="button" style="margin-top:0.75rem;"><i class="fa-regular fa-copy"></i> Copy UPI ID</button>
        </article>
      </section>

      <section class="membership-panel membership-card">
        <h3>Payment Status Tracker</h3>
        <div class="status-tracker" id="paymentStatusTracker">
          <div class="tracker-step" data-step="submitted"><span>1</span><label>Payment Submitted</label></div>
          <div class="tracker-step" data-step="review"><span>2</span><label>Under Review</label></div>
          <div class="tracker-step" data-step="approved"><span>3</span><label>Approved</label></div>
          <div class="tracker-step" data-step="active"><span>4</span><label>Premium Activated</label></div>
        </div>
        <p class="muted" id="trackerHint">Admin approval is required before premium unlocks.</p>
      </section>

      <section class="membership-panel membership-card" id="paymentSubmissionCard" style="display:none;">
        <h3>Submit Payment Proof</h3>
        <p class="muted">Enter transaction ID and an optional screenshot for faster verification.</p>
        <form id="paymentSubmissionForm" class="payment-form" enctype="multipart/form-data">
          <div class="form-grid">
            <div><label for="payFullName">Full Name</label><input id="payFullName" name="fullName" required /></div>
            <div><label for="payEmail">Registered Email</label><input id="payEmail" name="email" type="email" required /></div>
            <div>
              <label for="payMethodDisplay">Payment Method</label>
              <input id="payMethodDisplay" value="UPI" disabled />
              <input id="payMethod" name="paymentMethod" type="hidden" value="UPI" />
            </div>
            <div><label for="payTxn">Transaction ID / UTR</label><input id="payTxn" name="transactionId" required /></div>
            <div><label for="payScreenshot">Payment Screenshot (optional)</label><input id="payScreenshot" name="paymentScreenshot" type="file" accept="image/png,image/jpeg,image/webp" /></div>
            <div><label for="payDate">Payment Date</label><input id="payDate" name="paymentDate" type="date" required /></div>
          </div>
          <div style="margin-top:0.85rem;">
            <label for="payNote">Optional Note</label>
            <textarea id="payNote" name="note" rows="3" placeholder="Any additional payment context"></textarea>
          </div>
          <div class="actions" style="margin-top:12px; display:flex; gap:0.75rem; flex-wrap:wrap;">
            <button class="btn primary btn-pill" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit Payment</button>
            <button class="btn secondary btn-pill" id="cancelPaymentFormBtn" type="button">Cancel</button>
          </div>
        </form>
        <p class="muted" id="paymentSubmitStatus"></p>
      </section>

      <section class="membership-panel membership-card">
        <h3>Payment History</h3>
        <div class="history-wrap">
          <table class="payment-history-table">
            <thead>
              <tr>
                <th>Payment Date</th>
                <th>Transaction ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Expiry Date</th>
              </tr>
            </thead>
            <tbody id="paymentHistoryBody">
              <tr><td colspan="5" class="muted">No payments submitted yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </template>

  <script src="assets/js/api.js"></script>
  <script src="assets/vendor/qrcode/qrcode-generator.js"></script>
  <script src="assets/js/qrcode-shim.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/subscription.js"></script>
</body>
</html>
