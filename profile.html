<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .profile-layout {
      display: grid;
      gap: 1rem;
    }

    .summary-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: center;
      padding: 1.1rem;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .summary-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0f7b6c, #2f6fed);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .summary-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .summary-main h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .summary-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
      margin-top: 0.6rem;
    }

    .summary-chip {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 0.55rem;
    }

    .summary-chip label {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .summary-chip strong {
      font-size: 0.95rem;
    }

    .summary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.7rem;
    }

    .quick-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
    }

    .stat-card {
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: var(--shadow);
      padding: 0.8rem;
      transition: transform 130ms ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-card label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: block;
    }

    .stat-card strong {
      font-size: 1.3rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .progress-item {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background: #fff;
      padding: 0.75rem;
    }

    .progress-item .progress {
      margin-top: 0.4rem;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.7rem;
    }

    .badge-card {
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #fff;
      padding: 0.75rem;
    }

    .badge-card.locked {
      opacity: 0.65;
      filter: grayscale(0.2);
    }

    .badge-card i {
      color: #8b6f00;
      margin-right: 0.45rem;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .activity-box {
      border-radius: 12px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
    }

    .activity-list {
      margin: 0.4rem 0 0;
      padding-left: 1rem;
      color: var(--muted);
    }

    .improved-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .info-card {
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: var(--shadow);
      padding: 0.85rem;
    }

    .info-card .value {
      font-size: 1.45rem;
      font-family: 'Space Grotesk', sans-serif;
      margin: 0.3rem 0;
    }

    @media (max-width: 980px) {
      .summary-meta,
      .progress-grid,
      .improved-cards,
      .activity-grid {
        grid-template-columns: 1fr;
      }

      .summary-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="hero">
      <h1 data-page-title>User Profile</h1>
      <p>Manage achievements, roadmaps, and saved notes.</p>
    </section>

    <section class="profile-layout">
      <article class="summary-card">
        <div class="summary-avatar" id="profileAvatar">U</div>
        <div class="summary-main">
          <h2 id="profileFullName">Student Name</h2>
          <p class="muted" id="profileEmail">email@example.com</p>

          <div class="summary-meta">
            <div class="summary-chip"><label>College</label><strong id="profileCollege">-</strong></div>
            <div class="summary-chip"><label>Course / Branch</label><strong id="profileBranch">Not set</strong></div>
            <div class="summary-chip"><label>Semester / Year</label><strong id="profileSemester">Not set</strong></div>
            <div class="summary-chip"><label>Join Date</label><strong id="profileJoinDate">-</strong></div>
            <div class="summary-chip"><label>Current Streak</label><strong data-stat="currentStreak">0</strong></div>
            <div class="summary-chip"><label>Total XP</label><strong data-stat="totalXp">0</strong></div>
          </div>

          <div class="summary-actions">
            <button class="btn primary" id="editProfileBtn"><i class="fa-solid fa-pen"></i> Edit Profile</button>
            <button class="btn secondary" id="changePasswordBtn"><i class="fa-solid fa-key"></i> Change Password</button>
            <button class="btn secondary" id="uploadPhotoBtn"><i class="fa-solid fa-camera"></i> Upload Profile Photo</button>
            <input type="file" id="uploadPhotoInput" accept="image/*" style="display:none;" />
          </div>
          <p class="muted" id="profileActionStatus"></p>
        </div>
      </article>

      <section class="quick-stats">
        <article class="stat-card"><label>Total XP</label><strong data-stat="totalXp">0</strong></article>
        <article class="stat-card"><label>Current Streak</label><strong data-stat="currentStreak">0</strong></article>
        <article class="stat-card"><label>Mock Tests Attempted</label><strong data-stat="mockTestsAttempted">0</strong></article>
        <article class="stat-card"><label>Certificates Earned</label><strong data-stat="certificatesEarned">0</strong></article>
        <article class="stat-card"><label>Saved Notes</label><strong data-stat="savedNotes">0</strong></article>
        <article class="stat-card"><label>Completed Roadmaps</label><strong data-stat="completedRoadmaps">0</strong></article>
      </section>

      <article class="card">
        <h3><i class="fa-solid fa-chart-line"></i> Learning Progress</h3>
        <div class="progress-grid">
          <div class="progress-item">
            <label>Roadmap Completion</label>
            <strong id="progressRoadmapValue">0%</strong>
            <div class="progress"><span id="progressRoadmapFill" style="width:0%"></span></div>
          </div>
          <div class="progress-item">
            <label>Mock Test Performance</label>
            <strong id="progressMockValue">0%</strong>
            <div class="progress"><span id="progressMockFill" style="width:0%"></span></div>
          </div>
          <div class="progress-item">
            <label>Certification Progress</label>
            <strong id="progressCertValue">0%</strong>
            <div class="progress"><span id="progressCertFill" style="width:0%"></span></div>
          </div>
        </div>
      </article>

      <article class="card">
        <h3><i class="fa-solid fa-trophy"></i> Achievements / Badges</h3>
        <div class="badges-grid" id="achievementsGrid"></div>
      </article>

      <article class="card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Activity</h3>
        <div class="activity-grid">
          <div class="activity-box"><strong>Recently Viewed Notes</strong><ul class="activity-list" id="activityNotes"></ul></div>
          <div class="activity-box"><strong>Recently Attempted Mock Tests</strong><ul class="activity-list" id="activityMocks"></ul></div>
          <div class="activity-box"><strong>Recently Earned Certificates</strong><ul class="activity-list" id="activityCertificates"></ul></div>
          <div class="activity-box"><strong>Last Roadmap Opened</strong><ul class="activity-list" id="activityRoadmap"></ul></div>
        </div>
      </article>

      <section class="improved-cards">
        <article class="info-card">
          <h3><i class="fa-solid fa-graduation-cap"></i> My Certificates</h3>
          <p class="value" data-stat="certificates">0</p>
          <p class="muted" id="certificatesEmptyText">No certificates yet. Complete quizzes and tests to unlock your first certificate.</p>
          <div class="actions"><a class="btn secondary" href="certificates.html">Gallery View</a></div>
        </article>
        <article class="info-card">
          <h3><i class="fa-solid fa-map"></i> My Roadmaps</h3>
          <p class="value" data-stat="myRoadmaps">0</p>
          <p class="muted" id="roadmapsEmptyText">Start your roadmap journey to track career progress.</p>
          <div class="actions"><a class="btn secondary" href="study-roadmap.html">Open Roadmaps</a></div>
        </article>
        <article class="info-card">
          <h3><i class="fa-solid fa-bookmark"></i> My Saved Notes</h3>
          <p class="value" data-stat="savedNotes">0</p>
          <p class="muted" id="notesEmptyText">No saved notes yet. Bookmark key concepts while studying.</p>
          <div class="actions"><a class="btn secondary" href="notes-library.html">View Saved Notes</a></div>
        </article>
      </section>
    </section>
  </template>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
