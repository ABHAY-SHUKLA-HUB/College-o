<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - College OS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    .settings-layout {
      display: grid;
      gap: 1rem;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .section-head i {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #0f7b6c, #2f6fed);
    }

    .section-head h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .field {
      display: grid;
      gap: 0.35rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 11px;
      background: #fff;
      padding: 0.65rem 0.75rem;
    }

    .switch-row .meta {
      display: grid;
      gap: 0.1rem;
    }

    .switch-row .meta strong {
      font-size: 0.95rem;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      display: inline-block;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #c9ced6;
      transition: 0.2s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: '';
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: #fff;
      transition: 0.2s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background: #0f7b6c;
    }

    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }

    .sessions-list {
      margin-top: 0.6rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background: #fff;
      padding: 0.6rem;
      max-height: 170px;
      overflow: auto;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .sessions-list li {
      margin: 0.35rem 0;
    }

    @media (max-width: 900px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-shell></div>
  <template data-page>
    <section class="hero"><h1 data-page-title>Settings</h1><p>Manage profile, icon style, notifications, and accessibility preferences.</p></section>

    <section class="settings-layout">
      <form id="iconSettingsForm">
        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-user-gear"></i><h3>Account Settings</h3></div>
          <div class="settings-grid">
            <div class="field"><label>Change Name</label><input id="settingsName" placeholder="Full name" /></div>
            <div class="field"><label>Change Email</label><input id="settingsEmail" type="email" placeholder="Email address" /></div>
            <div class="field"><label>Update College</label><input id="settingsCollege" placeholder="College name" /></div>
            <div class="field"><label>Academic Category</label><select id="settingsCategory"><option value="">Select Category</option></select></div>
            <div class="field"><label>Branch / Course</label><select id="settingsBranch" disabled><option value="">Select Branch</option></select></div>
            <div class="field"><label>Semester / Year</label><select id="settingsSemester"><option value="">Select Semester</option></select></div>
            <div class="field"><label>Target Exam</label><input id="settingsTargetExam" placeholder="Optional (e.g., GATE, CAT)" /></div>
            <div class="field"><label>Career Interest</label><input id="settingsCareerInterest" placeholder="Optional career goal" /></div>
            <div class="field"><label>Preferred Study Mode</label><select id="settingsStudyMode"><option value="">Select Study Mode</option><option value="self-paced">Self-Paced</option><option value="structured">Structured Course</option><option value="mixed">Mixed Approach</option></select></div>
          </div>
        </article>

        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-palette"></i><h3>Appearance Settings</h3></div>
          <div class="settings-grid">
            <div class="field"><label>Icon Size</label><select id="iconSize"><option>small</option><option selected>medium</option><option>large</option></select></div>
            <div class="field"><label>Icon Style</label><select id="iconStyle"><option>fontawesome</option><option>material</option></select></div>
            <div class="field"><label>Font Size</label><select id="fontSize"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select></div>
            <div class="field"><label>Theme Selection</label><select id="themeMode"><option value="light">Light</option><option value="dark">Dark</option><option value="system" selected>System</option></select></div>
            <div class="field full">
              <div class="switch-row">
                <div class="meta"><strong>Dark Mode Compatibility</strong><span>Optimize icons and UI contrast for dark backgrounds</span></div>
                <label class="switch"><input id="iconDarkSwitch" type="checkbox" /><span class="slider"></span></label>
              </div>
            </div>
          </div>
        </article>

        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-bell"></i><h3>Notification Settings</h3></div>
          <div class="settings-grid">
            <div class="switch-row"><div class="meta"><strong>Email Alerts</strong><span>General account and activity notifications</span></div><label class="switch"><input id="notifyEmail" type="checkbox" checked /><span class="slider"></span></label></div>
            <div class="switch-row"><div class="meta"><strong>Mock Test Reminders</strong><span>Reminders before upcoming tests</span></div><label class="switch"><input id="notifyMock" type="checkbox" checked /><span class="slider"></span></label></div>
            <div class="switch-row"><div class="meta"><strong>Certificate Alerts</strong><span>Get notified when certificates are issued</span></div><label class="switch"><input id="notifyCert" type="checkbox" checked /><span class="slider"></span></label></div>
            <div class="switch-row"><div class="meta"><strong>Roadmap Updates</strong><span>Progress milestones and roadmap updates</span></div><label class="switch"><input id="notifyRoadmap" type="checkbox" checked /><span class="slider"></span></label></div>
          </div>
        </article>

        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-user-shield"></i><h3>Privacy Settings</h3></div>
          <div class="settings-grid">
            <div class="switch-row"><div class="meta"><strong>Profile Visibility</strong><span>Allow others to view your profile</span></div><label class="switch"><input id="privacyProfile" type="checkbox" checked /><span class="slider"></span></label></div>
            <div class="switch-row"><div class="meta"><strong>Leaderboard Visibility</strong><span>Show your name in leaderboard rankings</span></div><label class="switch"><input id="privacyLeaderboard" type="checkbox" checked /><span class="slider"></span></label></div>
            <div class="switch-row full"><div class="meta"><strong>Data Sharing Controls</strong><span>Allow anonymous usage analytics for product improvement</span></div><label class="switch"><input id="privacyDataSharing" type="checkbox" /><span class="slider"></span></label></div>
          </div>
        </article>

        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-lock"></i><h3>Security Settings</h3></div>
          <div class="settings-grid">
            <div class="field"><label>Current Password</label><input id="currentPassword" type="password" placeholder="Enter current password" /></div>
            <div class="field"><label>New Password</label><input id="newPassword" type="password" placeholder="Enter new password" /></div>
            <div class="switch-row full"><div class="meta"><strong>Two-Factor Authentication</strong><span>Add an extra verification step at login</span></div><label class="switch"><input id="security2FA" type="checkbox" /><span class="slider"></span></label></div>
            <div class="field full">
              <label>Active Sessions</label>
              <ul id="activeSessionsList" class="sessions-list"><li>Loading active sessions...</li></ul>
            </div>
            <div class="actions full"><button id="refreshSessionsBtn" class="btn secondary" type="button">View Active Sessions</button><button id="logoutAllDevicesBtn" class="btn warn" type="button">Logout from All Devices</button></div>
          </div>
        </article>

        <article class="section-card">
          <div class="section-head"><i class="fa-solid fa-universal-access"></i><h3>Accessibility Settings</h3></div>
          <div class="settings-grid">
            <div class="field"><label>Icon Scaling</label><select id="iconScaling"><option value="0.9">90%</option><option value="1" selected>100%</option><option value="1.1">110%</option><option value="1.25">125%</option></select></div>
            <div class="field"><label>Text Size Adjustment</label><select id="textSize"><option value="0.95">Small</option><option value="1" selected>Normal</option><option value="1.1">Large</option><option value="1.2">Extra Large</option></select></div>
            <div class="switch-row full"><div class="meta"><strong>High Contrast Mode</strong><span>Increase readability with stronger text/background contrast</span></div><label class="switch"><input id="highContrast" type="checkbox" /><span class="slider"></span></label></div>
          </div>
        </article>

        <div class="actions">
          <button class="btn primary" type="submit">Save Settings</button>
          <button id="resetSettingsBtn" class="btn secondary" type="button">Reset Settings</button>
        </div>
        <p class="muted" id="settingsFeedback"></p>
      </form>
    </section>
  </template>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/settings.js"></script>
</body>
</html>
